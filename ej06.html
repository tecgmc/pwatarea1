<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 6 | Diseño de caja</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fb;color:#243047;line-height:1.6}.wrap{max-width:900px;margin:45px auto;padding:0 20px}.card{background:#fff;padding:32px;border-radius:18px;box-shadow:0 12px 30px #1e293b12}h1{color:#1d4ed8;margin-top:0}a{color:#2563eb} .back{display:inline-block;margin-bottom:18px;text-decoration:none;font-weight:bold}.btn{border:0;background:#2563eb;color:#fff;padding:11px 18px;border-radius:9px;cursor:pointer;font-size:1rem}.btn:hover{background:#1d4ed8} .controls{margin:20px 0}.controls input{width:100%;accent-color:#7c3aed}.slider-box{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;border:4px solid #7c3aed;border-radius:22px;background:linear-gradient(135deg,#ede9fe,#dbeafe);box-shadow:0 12px 25px #7c3aed22}.slider-box p{font-size:24px;font-weight:800;color:#4c1d95;max-width:600px}
</style>

</head>
<body>
<main class="wrap"><a class="back" href="index.html">← Volver al menú</a><section class="card"><h1>Diseño de caja interactiva</h1><p>Usa el control deslizante para cambiar el tamaño del texto dentro de la caja.</p><div class="controls"><label for="tamano">Tamaño del texto: <strong id="valor">24</strong> px</label><input id="tamano" type="range" min="16" max="42" value="24"></div><div class="slider-box"><p id="mensaje">¡Aprender programación abre nuevas posibilidades!</p></div></section></main>
<script>const slider=document.getElementById('tamano');const mensaje=document.getElementById('mensaje');const valor=document.getElementById('valor');slider.addEventListener('input',()=>{mensaje.style.fontSize=slider.value+'px';valor.textContent=slider.value;});</script>
</body>
</html>
