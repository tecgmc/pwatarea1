<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 4 | Formulario básico</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fb;color:#243047;line-height:1.6}.wrap{max-width:900px;margin:45px auto;padding:0 20px}.card{background:#fff;padding:32px;border-radius:18px;box-shadow:0 12px 30px #1e293b12}h1{color:#1d4ed8;margin-top:0}a{color:#2563eb} .back{display:inline-block;margin-bottom:18px;text-decoration:none;font-weight:bold}.btn{border:0;background:#2563eb;color:#fff;padding:11px 18px;border-radius:9px;cursor:pointer;font-size:1rem}.btn:hover{background:#1d4ed8}form{display:grid;gap:9px}label{font-weight:bold;margin-top:8px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}input:focus{outline:2px solid #93c5fd;border-color:#2563eb}#resultado{font-weight:bold;color:#047857}
</style>

</head>
<body>
<main class="wrap"><a class="back" href="index.html">← Volver al menú</a><section class="card"><h1>Formulario de registro</h1><form id="registro"><label for="nombre">Nombre completo</label><input id="nombre" name="nombre" type="text" placeholder="Escribe tu nombre" required><label for="correo">Correo electrónico</label><input id="correo" name="correo" type="email" placeholder="nombre@correo.com" required><label for="edad">Edad</label><input id="edad" name="edad" type="number" min="1" max="120" placeholder="Ej. 20" required><button class="btn" type="submit">Enviar formulario</button></form><p id="resultado" role="status"></p></section></main>
<script>document.getElementById('registro').addEventListener('submit',function(e){e.preventDefault();const nombre=document.getElementById('nombre').value.trim();document.getElementById('resultado').textContent='¡Gracias, '+nombre+'! El formulario se ha enviado correctamente en esta demostración.';this.reset();});</script>
</body>
</html>
