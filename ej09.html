<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicio 9 | Galería de imágenes</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fb;color:#243047;line-height:1.6}.wrap{max-width:900px;margin:45px auto;padding:0 20px}.card{background:#fff;padding:32px;border-radius:18px;box-shadow:0 12px 30px #1e293b12}h1{color:#1d4ed8;margin-top:0}a{color:#2563eb} .back{display:inline-block;margin-bottom:18px;text-decoration:none;font-weight:bold}.btn{border:0;background:#2563eb;color:#fff;padding:11px 18px;border-radius:9px;cursor:pointer;font-size:1rem}.btn:hover{background:#1d4ed8} .gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}.photo{border:0;padding:0;overflow:hidden;border-radius:14px;background:#e2e8f0;cursor:pointer;text-align:left;box-shadow:0 8px 20px #0f172a12}.photo img{display:block;width:100%;height:180px;object-fit:cover;transition:transform .25s}.photo:hover img{transform:scale(1.05)}.photo span{display:block;padding:12px;font-weight:bold;color:#1e3a8a}.modal{display:none;position:fixed;inset:0;background:#0f172aeF;z-index:10;align-items:center;justify-content:center;flex-direction:column;padding:25px}.modal.open{display:flex}.modal img{max-width:min(900px,95vw);max-height:75vh;object-fit:contain;border-radius:12px}.modal p{color:white;font-size:1.2rem;font-weight:bold}.close{position:absolute;top:15px;right:25px;border:0;background:transparent;color:white;font-size:3rem;cursor:pointer}@media(max-width:650px){.gallery{grid-template-columns:1fr}.photo img{height:220px}}
</style>

</head>
<body>
<main class="wrap"><a class="back" href="index.html">← Volver al menú</a><section class="card"><h1>Galería de pasatiempos</h1><p>Haz clic en cualquiera de las imágenes para abrirla en una ventana emergente.</p><div class="gallery"><button class="photo" data-title="Lectura"><img src="https://images.unsplash.com/photo-1519682337058-a94d519337bc?auto=format&fit=crop&w=900&q=80" alt="Libros abiertos sobre una mesa"><span>Lectura</span></button><button class="photo" data-title="Música"><img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=900&q=80" alt="Instrumentos y equipo musical"><span>Música</span></button><button class="photo" data-title="Naturaleza"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Paisaje natural de montañas y lago"><span>Explorar la naturaleza</span></button></div></section><div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Imagen ampliada"><button id="cerrar" class="close" aria-label="Cerrar ventana">×</button><p id="titulo"></p><img id="imagenGrande" alt=""></div></main>
<script>const modal=document.getElementById('modal'),big=document.getElementById('imagenGrande'),title=document.getElementById('titulo');document.querySelectorAll('.photo').forEach(btn=>btn.addEventListener('click',()=>{const img=btn.querySelector('img');big.src=img.src;big.alt=img.alt;title.textContent=btn.dataset.title;modal.classList.add('open');document.getElementById('cerrar').focus();}));function closeModal(){modal.classList.remove('open');big.src='';}document.getElementById('cerrar').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});</script>
</body>
</html>
